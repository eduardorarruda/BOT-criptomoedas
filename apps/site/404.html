<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title data-i18n="e404.meta">Página não encontrada | ZenTrade</title>
    <meta name="theme-color" content="#070c0a" />
    <link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/img/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <link rel="stylesheet" href="/estilos.css" />
  </head>
  <body class="pagina-404">
    <main class="perdido" id="conteudo">
      <div class="perdido-arte" aria-hidden="true">
        <img src="/img/enso.webp" alt="" width="760" height="760" />
        <svg viewBox="0 0 1140 1140">
          <rect class="vela-pavio" x="544" y="383" width="18" height="400" rx="9" />
          <rect class="vela-corpo" x="515" y="467" width="76" height="232" rx="10" />
        </svg>
      </div>
      <div class="perdido-texto">
        <p class="perdido-codigo">404</p>
        <h1 data-i18n="e404.titulo">Esta página não está aqui.</h1>
        <p class="intro" data-i18n="e404.texto">
          O endereço pode ter mudado, ou nunca existiu. Nada se perdeu: o resto do site continua onde estava.
        </p>
        <div class="acoes">
          <a class="botao primario" href="/" data-i18n="e404.voltar">Voltar para o início</a>
        </div>
      </div>
    </main>
    <script>
      (async () => {
        const IDIOMAS = { pt: "pt-BR", en: "en", hi: "hi", es: "es", zh: "zh-CN" };
        let idioma = "pt";
        try {
          const salvo = localStorage.getItem("zt-idioma");
          const nav = (navigator.language || "pt").slice(0, 2).toLowerCase();
          idioma = IDIOMAS[salvo] ? salvo : IDIOMAS[nav] ? nav : "pt";
        } catch {
          idioma = "pt";
        }
        if (idioma === "pt") return;
        try {
          const T = await (await fetch(`/i18n/${idioma}.json`)).json();
          for (const el of document.querySelectorAll("[data-i18n]")) {
            const v = T.estatico?.[el.dataset.i18n];
            if (v) el.textContent = v;
          }
          document.documentElement.lang = IDIOMAS[idioma];
          document.documentElement.classList.add("idioma-" + idioma);
        } catch {
          /* sem tradução: fica em português */
        }
      })();
    </script>
  </body>
</html>
