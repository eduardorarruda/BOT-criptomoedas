# Tela do ZenTrade. A API fica atrás do mesmo endereço (/api), então cookie
# SameSite=Strict e a origem do WebSocket funcionam sem CORS.
map $http_upgrade $conexao_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  # Pluggy Connect (renda fixa → conectar banco): script do widget, iframe e logos dos bancos.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn.pluggy.ai; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.pluggy.ai; frame-src https://connect.pluggy.ai; connect-src 'self' ws: wss: https://api.pluggy.ai; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /saude-web {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexao_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  # Webhooks do n8n não passam pela tela: o n8n fala direto com a API.
  location /webhooks/ {
    return 404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn.pluggy.ai; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.pluggy.ai; frame-src https://connect.pluggy.ai; connect-src 'self' ws: wss: https://api.pluggy.ai; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }
}
