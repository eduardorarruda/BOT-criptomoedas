# ZenTrade com Docker.
#
# Só a infra de desenvolvimento (banco, Redis e n8n), para rodar os serviços com `pnpm dev`:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
# Tudo junto (perfil "app": migração, api, motor, agente e tela, além da infra):
#   docker compose --env-file .env -f infra/docker-compose.yml --profile app up -d --build
#
# As portas ficam presas em 127.0.0.1: nada disso deve ficar exposto na rede. O agente
# e o motor não publicam porta nenhuma. As portas do host mudam por variável (*_PORTA_HOST).
# Senhas entram em URLs (postgres://, redis://): use as geradas com `openssl rand -hex 32`.
name: zentrade

x-ambiente-comum: &ambiente-comum
  DATABASE_URL: postgres://${POSTGRES_USER:-zentrade}:${POSTGRES_PASSWORD:-}@banco:5432/${POSTGRES_DB:-zentrade}
  REDIS_URL: redis://:${REDIS_SENHA:-}@redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: UTC
  # O "hoje" da instância (perda do dia, resultado do dia, orçamento de IA): nome IANA.
  # Os dados continuam em UTC; só os limites de dia e de mês seguem este fuso.
  ZENTRADE_FUSO: ${ZENTRADE_FUSO:-America/Sao_Paulo}

services:
  banco:
    # timescaledb-ha já traz TimescaleDB e pgvector; o pg17 é a versão suportada.
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-zentrade}
    ports:
      - "127.0.0.1:${BANCO_PORTA_HOST:-55432}:5432"
    volumes:
      - banco:/home/postgres/pgdata
    healthcheck:
      # Por TCP: durante a inicialização o servidor temporário só ouve no socket local,
      # e o pg_isready pelo socket diria "pronto" antes da hora (a migração falharia).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_SENHA:?defina REDIS_SENHA no .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORTA_HOST:-56379}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_SENHA}" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_SENHA: ${REDIS_SENHA}

  n8n:
    # Versão fixada: atualizar o n8n é uma decisão, não um efeito colateral do pull.
    image: n8nio/n8n:2.42.6
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # O n8n assina e confere os webhooks com o mesmo segredo da API.
      N8N_WEBHOOK_SEGREDO: ${N8N_WEBHOOK_SEGREDO:?defina N8N_WEBHOOK_SEGREDO no .env}
      # Com o perfil app, use http://api:8080; com a API rodando no host (pnpm dev), o padrão.
      ZENTRADE_API_URL: ${ZENTRADE_API_URL_PARA_N8N:-http://host.docker.internal:8080}
      # Usadas pelos fluxos de infra/n8n (veja infra/n8n/README.md); tokens vão em credenciais.
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_APROVADORES_IDS: ${TELEGRAM_APROVADORES_IDS:-}
      ZENTRADE_FEEDS_RSS: ${ZENTRADE_FEEDS_RSS:-}
      ZENTRADE_ALERTA_EMAIL: ${ZENTRADE_ALERTA_EMAIL:-}
      ZENTRADE_ALERTA_EMAIL_DE: ${ZENTRADE_ALERTA_EMAIL_DE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${N8N_PORTA_HOST:-5678}:5678"
    volumes:
      - n8n:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # --- Perfil "app": os serviços do ZenTrade ---

  # Aplica as migrações e sai. A API só sobe depois que ela termina bem.
  migrar:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    image: ${ZENTRADE_IMAGEM:-zentrade}-api:local
    command: ["node", "node_modules/@zentrade/banco/dist/comandos/migrar.js"]
    environment:
      <<: *ambiente-comum
    depends_on:
      banco: { condition: service_healthy }
    restart: "no"

  api:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    image: ${ZENTRADE_IMAGEM:-zentrade}-api:local
    restart: unless-stopped
    environment:
      <<: *ambiente-comum
      ZENTRADE_CHAVE_MESTRA: ${ZENTRADE_CHAVE_MESTRA:-}
      # A origem da tela servida pelo nginx (CORS e WebSocket só aceitam esta).
      ZENTRADE_ORIGEM_WEB: ${ZENTRADE_ORIGEM_WEB_DOCKER:-http://localhost:${WEB_PORTA_HOST:-8088}}
      COOKIE_SEGURO: ${COOKIE_SEGURO:-true}
      CLAUDE_EXIGE_2FA: ${CLAUDE_EXIGE_2FA:-true}
      # A tela (nginx) é o proxy na frente da API, na rede privada do Docker; ela sobrescreve
      # o X-Forwarded-For com o IP real da conexão.
      API_PROXY_CONFIAVEL: ${API_PROXY_CONFIAVEL:-loopback,uniquelocal}
      APROVACAO_VALIDADE_MIN: ${APROVACAO_VALIDADE_MIN:-15}
      N8N_URL: http://n8n:5678
      N8N_WEBHOOK_SEGREDO: ${N8N_WEBHOOK_SEGREDO:-}
      N8N_USUARIO_ID: ${N8N_USUARIO_ID:-}
      AGENTE_URL: http://agente:8081
      # Mesmo segredo do agente: a API repassa o assistente (chat) para ele.
      AGENTE_SEGREDO: ${AGENTE_SEGREDO:-}
      EMBEDDINGS_PROVEDOR: ${EMBEDDINGS_PROVEDOR:-voyage}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODELO: ${VOYAGE_MODELO:-voyage-4}
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_MODELO: ${OLLAMA_MODELO:-bge-m3}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      # LGPD: quem responde pelos dados desta instância (aparece na política de privacidade).
      ZENTRADE_CONTROLADOR_NOME: ${ZENTRADE_CONTROLADOR_NOME:-}
      ZENTRADE_CONTROLADOR_EMAIL: ${ZENTRADE_CONTROLADOR_EMAIL:-}
      ZENTRADE_ENCARREGADO_NOME: ${ZENTRADE_ENCARREGADO_NOME:-}
      ZENTRADE_ENCARREGADO_EMAIL: ${ZENTRADE_ENCARREGADO_EMAIL:-}
      # Pasta do volume "importacoes-b3" (abaixo): a API só grava o .zip aqui; quem lê e
      # descompacta (até 560 MB) é o motor-backtests, pelo mesmo volume.
      ZENTRADE_IMPORTACOES_B3_DIR: /dados/importacoes-b3
      # Com o perfil mt5 (abaixo), use http://coletor-mt5:8090; vazio = botão explica o que falta.
      COLETOR_MT5_URL: ${COLETOR_MT5_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORTA_HOST:-8080}:8080"
    # Healthcheck na imagem (infra/docker/api.Dockerfile): GET /api/v1/saude.
    volumes:
      - importacoes-b3:/dados/importacoes-b3
    depends_on:
      migrar: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  motor:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/docker/motor.Dockerfile }
    image: ${ZENTRADE_IMAGEM:-zentrade}-motor:local
    restart: unless-stopped
    environment: &ambiente-motor
      <<: *ambiente-comum
      # Este processo só roda os robôs; os backtests ficam no motor-backtests, para um
      # backtest pesado (CPU por minutos) não atrasar velas, stops e decisões ao vivo.
      MOTOR_FUNCAO: robos
      # Dinheiro real não liga por aqui: papel (simulado) ou testnet.
      MOTOR_REDE: ${MOTOR_REDE:-papel}
      MOTOR_PAPEL_DADOS: ${MOTOR_PAPEL_DADOS:-testnet}
      MOTOR_PAPEL_SALDO: ${MOTOR_PAPEL_SALDO:-1000}
      MOTOR_PAPEL_TAXA: ${MOTOR_PAPEL_TAXA:-0.001}
      MOTOR_PAPEL_DESLIZAMENTO_BPS: ${MOTOR_PAPEL_DESLIZAMENTO_BPS:-5}
      MOTOR_ROBOS_ARQUIVO: ${MOTOR_ROBOS_ARQUIVO_DOCKER:-robos.exemplo.json}
      MOTOR_HISTORICO: ${MOTOR_HISTORICO:-1000}
      MOTOR_AGENTE_OBRIGATORIO: ${MOTOR_AGENTE_OBRIGATORIO:-true}
      MOTOR_AGENTE_FIXO: ${MOTOR_AGENTE_FIXO:-nunca_concorda}
      # Vazio = agente fixo acima. Para usar a IA: http://agente:8081 (exige AGENTE_SEGREDO).
      AGENTE_URL: ${MOTOR_AGENTE_URL:-}
      AGENTE_SEGREDO: ${AGENTE_SEGREDO:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_TAXA_ESTIMADA: ${BINANCE_TAXA_ESTIMADA:-0.001}
      # A mesma chave mestra da API: decifra a chave da Binance de cada pessoa (obrigatória na testnet).
      ZENTRADE_CHAVE_MESTRA: ${ZENTRADE_CHAVE_MESTRA:-}
      # "desenvolvimento" libera BINANCE_API_KEY/SECRET acima para quem não cadastrou chave.
      ZENTRADE_AMBIENTE: ${ZENTRADE_AMBIENTE:-producao}
      # Só o comando importar-candles-b3 usa (Ibovespa intradiário; veja docs/dados-b3.md).
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      # Coletor do MetaTrader 5 (perfil mt5) e a atualização diária do WIN depois do fechamento.
      COLETOR_MT5_URL: ${COLETOR_MT5_URL:-}
      MOTOR_MT5_AUTO: ${MOTOR_MT5_AUTO:-true}
      MOTOR_MT5_HORA: ${MOTOR_MT5_HORA:-19}
      MOTOR_MT5_HISTORICO_DIAS: ${MOTOR_MT5_HISTORICO_DIAS:-730}
    depends_on:
      migrar: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # A mesma imagem do motor, só consumindo a fila de backtests (e a de importações da B3).
  motor-backtests:
    profiles: ["app"]
    image: ${ZENTRADE_IMAGEM:-zentrade}-motor:local
    restart: unless-stopped
    environment:
      <<: *ambiente-motor
      MOTOR_FUNCAO: backtests
    volumes:
      - importacoes-b3:/dados/importacoes-b3
    depends_on:
      migrar: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      motor: { condition: service_started }

  agente:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/docker/agente.Dockerfile }
    image: ${ZENTRADE_IMAGEM:-zentrade}-agente:local
    restart: unless-stopped
    # Sem "ports": o agente só é alcançado pela rede interna (motor e API).
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-zentrade}:${POSTGRES_PASSWORD:-}@banco:5432/${POSTGRES_DB:-zentrade}
      # Para os passos ao vivo das análises (eventos "analise" em zentrade:eventos).
      REDIS_URL: redis://:${REDIS_SENHA:-}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # O mesmo fuso da API e do motor: o "hoje" do orçamento de IA e do assistente.
      ZENTRADE_FUSO: ${ZENTRADE_FUSO:-America/Sao_Paulo}
      # Opcional: sem a chave, só o Claude Code (provedor "cli") atende.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # A mesma chave mestra da API: cifra e decifra o token do Claude que cada pessoa conecta
      # pela tela (Assistente → Configurações). Sem ela, só as contas abaixo.
      ZENTRADE_CHAVE_MESTRA: ${ZENTRADE_CHAVE_MESTRA:-}
      # Contas do Claude Code (alternativa ao token de cada pessoa): id=/pasta, separadas por
      # vírgula, dentro do volume claude-contas.
      AGENTE_CLAUDE_CONTAS: ${AGENTE_CLAUDE_CONTAS:-principal=/dados/claude/principal}
      AGENTE_CLI_MAX_TURNOS: ${AGENTE_CLI_MAX_TURNOS:-8}
      AGENTE_CLI_TETO_USD: ${AGENTE_CLI_TETO_USD:-1}
      AGENTE_CENARIO_LIMIAR: ${AGENTE_CENARIO_LIMIAR:-0.6}
      AGENTE_CHAT_TIMEOUT_MS: ${AGENTE_CHAT_TIMEOUT_MS:-300000}
      AGENTE_SEGREDO: ${AGENTE_SEGREDO:-}
      AGENTE_MODELO: ${AGENTE_MODELO:-claude-opus-5}
      AGENTE_TIMEOUT_MS: ${AGENTE_TIMEOUT_MS:-55000}
      AGENTE_MAX_SIMULTANEAS: ${AGENTE_MAX_SIMULTANEAS:-4}
      AGENTE_MAX_POR_MINUTO: ${AGENTE_MAX_POR_MINUTO:-30}
      ZENTRADE_USUARIO_ID: ${ZENTRADE_USUARIO_ID:-}
      EMBEDDINGS_PROVEDOR: ${EMBEDDINGS_PROVEDOR:-voyage}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODELO: ${VOYAGE_MODELO:-voyage-4}
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_MODELO: ${OLLAMA_MODELO:-bge-m3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # O login do Claude Code de cada conta (fica fora do container; veja docs/operacao.md).
    volumes:
      - claude-contas:/dados/claude
    depends_on:
      migrar: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      # Privada por padrão (noindex). Demonstração pública: VITE_PUBLICO=1 e VITE_URL_PUBLICA (docs/operacao.md).
      args:
        VITE_PUBLICO: ${VITE_PUBLICO:-}
        VITE_URL_PUBLICA: ${VITE_URL_PUBLICA:-}
        VITE_DEMO: ${VITE_DEMO:-}
    image: ${ZENTRADE_IMAGEM:-zentrade}-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORTA_HOST:-8088}:8080"
    depends_on:
      api: { condition: service_healthy }

  # --- Perfil "mt5": dados do mini índice pelo MetaTrader 5 (opcional e pesado) ---
  # Sem este perfil nada disto é baixado nem construído. Nenhum dos dois publica porta no
  # host: só a rede do compose alcança o coletor (e o RPyC do terminal, que executa código,
  # nunca sai dele). Só leitura de dados; veja docs/adr/009-mt5-wine-docker.md.

  # Terminal MT5 sob Wine, com servidor RPyC na 8001 (projeto gmag11/MetaTrader5-Docker-Image,
  # MIT). Sem login aqui: quem abre a sessão é o coletor, com a conta cadastrada na tela.
  mt5-terminal:
    profiles: ["mt5"]
    image: ${MT5_TERMINAL_IMAGEM:-gmag11/metatrader5_vnc:latest}
    restart: unless-stopped
    environment:
      # Só para depuração visual (VNC web); a porta NÃO é publicada.
      CUSTOM_USER: ${MT5_VNC_USUARIO:-zentrade}
      PASSWORD: ${MT5_VNC_SENHA:-}
    volumes:
      - mt5-terminal:/config
    shm_size: "1gb"

  coletor-mt5:
    profiles: ["mt5"]
    build: { context: ../infra/coletor-mt5 }
    image: ${ZENTRADE_IMAGEM:-zentrade}-coletor-mt5:local
    restart: unless-stopped
    environment:
      MT5_RPYC_HOST: mt5-terminal
      MT5_RPYC_PORTA: "8001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - mt5-terminal

volumes:
  banco:
  redis:
  n8n:
  claude-contas:
  # .zip da B3 entre o upload (API) e o processamento (motor-backtests); a API apaga o
  # arquivo ao terminar, então o volume não cresce sem limite.
  importacoes-b3:
  mt5-terminal:
